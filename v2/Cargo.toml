[package]
name = "image-to-ascii-native"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[[bin]]
name = "image-to-ascii"
path = "src/main.rs"

[dependencies]
tezbar-extension-sdk = { version = "=0.1.1", git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std", "sync", "net"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls-webpki-roots", "multipart", "stream"] }
ryu-js = "=1.0.2"
regex = "=1.11.3"
libc = "=0.2.177"

[dev-dependencies]
tempfile = "=3.23.0"
sha2 = "=0.10.9"
semver = "=1.0.27"
tokio-rustls = {version="=0.26.4",default-features=false,features=["ring","tls12"]}
rustls-pemfile = "=2.2.0"
multer = "=3.1.0"
base64 = "=0.22.1"
walkdir = "=2.5.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
uuid = { version = "=1.23.3", features = ["v4"] }
futures-util = "=0.3.31"

[profile.release]
strip = true
lto = "thin"
